spring:
  application:
    name: online-exam-system
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:h2:mem:onlinequiz_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:manju}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d7e1b3a5f6c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours

logging:
  level:
    root: INFO
    com.example.exam: DEBUG
    org.springframework.security: INFO

server:
  port: 9095
